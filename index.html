<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<style>
/* Layout: one-column phone app — counters, filter chips, task list, fixed capture bar at the bottom; sheets slide up for editing */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#1B2130; --muted:#6A7387; --line:#DDE2EC;
  --accent:#3366E6; --accent-ink:#FFFFFF; --accent-soft:#E6EDFD;
  --danger:#D2433A; --danger-soft:#FBE9E7; --ok:#2E8B57;
  --c-hr:#3366E6; --c-hr-soft:#E6EDFD;
  --c-on:#0F8A7E; --c-on-soft:#DDF3F0;
  --c-sch:#B7791F; --c-sch-soft:#FBF0DC;
  --c-job:#7A4FD6; --c-job-soft:#EFE8FC;
  --c-etc:#5D6678; --c-etc-soft:#ECEEF3;
  --shadow:0 1px 2px rgba(20,30,60,.06);
  --font:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151C; --surface:#1B2029; --ink:#E8ECF4; --muted:#98A1B3; --line:#2C3340;
  --accent:#6B91F5; --accent-ink:#0E1424; --accent-soft:#1F2C4D;
  --danger:#F07A70; --danger-soft:#3A1F1E; --ok:#5BC48A;
  --c-hr:#7C9EF7; --c-hr-soft:#1F2C4D; --c-on:#4FC8BA; --c-on-soft:#143430;
  --c-sch:#E3AE5A; --c-sch-soft:#382B15; --c-job:#AE8DF2; --c-job-soft:#2A2142;
  --c-etc:#A3ABBB; --c-etc-soft:#262C37; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1B2029; --ink:#E8ECF4; --muted:#98A1B3; --line:#2C3340;
  --accent:#6B91F5; --accent-ink:#0E1424; --accent-soft:#1F2C4D;
  --danger:#F07A70; --danger-soft:#3A1F1E; --ok:#5BC48A;
  --c-hr:#7C9EF7; --c-hr-soft:#1F2C4D; --c-on:#4FC8BA; --c-on-soft:#143430;
  --c-sch:#E3AE5A; --c-sch-soft:#382B15; --c-job:#AE8DF2; --c-job-soft:#2A2142;
  --c-etc:#A3ABBB; --c-etc-soft:#262C37; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.calb{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 10px;font-size:13px;display:inline-flex;gap:4px;align-items:center}
.calb.on{color:var(--ok);border-color:transparent;background:none;padding-left:0}
.setrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
header{display:flex;align-items:center;gap:6px}
header h1{min-width:0;white-space:nowrap;overflow:hidden;font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
header h1 .pin{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.hbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:40px;padding:0 10px;flex:none;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500}
.hbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hbtn svg{width:18px;height:18px}
.dot{min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 5px;font-weight:700}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.cnt{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;text-align:center;box-shadow:var(--shadow)}
.cnt b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.cnt span{font-size:13px;color:var(--muted)}
.cnt.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cnt.on span{color:var(--accent-ink)}
.cnt .late{font-size:11px;color:var(--danger);display:block;height:14px;line-height:14px}
.cnt.on .late{color:var(--accent-ink)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:12px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:2px max(16px,env(safe-area-inset-left,0px)) 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec{font-size:13px;color:var(--muted);margin:18px 2px 8px;font-weight:500;display:flex;gap:8px;align-items:baseline}
.sec.late{color:var(--danger)}
.list{display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:none;display:grid;place-items:center;padding:0}
.chk svg{width:16px;height:16px;opacity:0}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.task.done .chk svg{opacity:1;color:#fff}
.tb{flex:1;min-width:0}
.ttl{font-weight:500;word-break:break-word;background:none;border:0;padding:0;text-align:left;width:100%;display:block}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:4px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{border-radius:6px;padding:1px 8px;font-size:12px;font-weight:500}
.t-hr{background:var(--c-hr-soft);color:var(--c-hr)} .t-on{background:var(--c-on-soft);color:var(--c-on)}
.t-sch{background:var(--c-sch-soft);color:var(--c-sch)} .t-job{background:var(--c-job-soft);color:var(--c-job)}
.t-etc{background:var(--c-etc-soft);color:var(--c-etc)}
.when.late{color:var(--danger);font-weight:700}
.bell{width:14px;height:14px;vertical-align:-2px}
.note{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;word-break:break-word}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qb{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 10px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 12px;border:1px dashed var(--line);border-radius:14px;margin-top:16px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.bar form{max-width:560px;margin:0 auto;display:flex;gap:8px}
.bar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 12px;height:46px;font-size:16px}
.btn{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.sm{height:36px;font-size:14px;padding:0 12px;border-radius:10px}
.storage{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
/* candidates */
.cand{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.cand.closed{opacity:.6}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch b{font-size:16px}
.media{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.steps{display:flex;gap:4px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.st{flex:none;font-size:12px;border-radius:999px;padding:3px 9px;border:1px solid var(--line);color:var(--muted);background:none}
.st.past{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.st.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.st.post{border-style:dashed}
.st.post.past{border-style:solid;background:var(--c-on-soft);color:var(--c-on)}
.st.post.cur{background:var(--c-on);border-color:var(--c-on);color:#fff}
.cnext{margin-top:10px;font-size:13px;color:var(--muted)}
.cnext strong{color:var(--ink)}
.cact{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ctasks{margin-top:8px;font-size:13px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.ctasks .late{color:var(--danger)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92%;overflow-y:auto;padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet h2{font-size:17px;margin:0 0 12px;text-wrap:balance}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label,.lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sact{display:flex;gap:8px;margin-top:6px}
.sact .btn{flex:1}
.preview{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;font-variant-numeric:tabular-nums}
.preview div{display:flex;gap:10px}
.preview span:first-child{color:var(--muted);flex:none;width:124px}
.help{font-size:13px;color:var(--muted);line-height:1.7}
.help ol{padding-left:20px;margin:6px 0}
.copybox{width:100%;min-height:120px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:14px;z-index:20;max-width:90%;box-shadow:0 4px 16px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>あとでやるタスク</h1>
    <button class="hbtn" id="flowBtn" type="button">採用フロー</button>
    <button class="hbtn" id="setBtn" type="button" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="hbtn" id="bellBtn" type="button" aria-label="リマインド"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span id="bellDot" class="dot" hidden></span></button>
  </header>

  <section id="taskView">
    <div class="counters" id="counters"></div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>

  <section id="flowView" hidden>
    <div class="sec" style="justify-content:space-between;align-items:center">
      <span>候補者ごとの進捗</span>
      <button class="btn sm pri" id="addCand" type="button">＋ 候補者を追加</button>
    </div>
    <div class="chips" id="candChips"></div>
    <div class="list" id="candList"></div>
  </section>
  <div class="storage" id="storage"></div>
</div>

<div class="bar" id="bar">
  <form id="cap">
    <input id="capIn" autocomplete="off" placeholder="思いついたらここに（未定に入ります）" enterkeyhint="done">
    <button class="btn pri" type="submit">追加</button>
    <button class="btn" type="button" id="capDetail">詳細</button>
  </form>
</div>
<div id="sheetRoot"></div>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const CATS=[["hr","人事・採用"],["on","入社後"],["sch","学校"],["job","就活"],["etc","その他"]];
const CATNAME=Object.fromEntries(CATS);
const MEDIA={
  coco:{n:"ココシロ",s:["応募","面談調整","面談実施","内定","入社後研修","入社"]},
  ref:{n:"リファラル",s:["トスアップ","面談調整","面談実施","内定","入社後研修","入社"]},
  infS:{n:"Infla（自己応募）",s:["応募","面談調整","面談実施","通過","2次面談実施","通過/内定","入社後研修","入社"]},
  infC:{n:"Infla（スカウト）",s:["応募","面談調整","面談実施","通過","2次面談実施","通過/内定","入社後研修","入社"]}
};
const POST=["入社手続き","入社後面談 日程回収","入社後面談 日程調整","入社後面談 実施","定着"];
const WD="日月火水木金土";

/* ---------- date utils (local time) ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const parse=(ds,ts)=>{const [y,m,d]=ds.split("-").map(Number);const [h,mi]=(ts||"23:59").split(":").map(Number);return new Date(y,m-1,d,h,mi)};
const addDays=(ds,n)=>{const d=parse(ds,"12:00");d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const label=ds=>{const d=parse(ds,"12:00");const t=today();const base=(d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")";
  if(ds===t)return base+" 今日";if(ds===addDays(t,1))return base+" 明日";if(ds===addDays(t,-1))return base+" 昨日";return base};
const shortDate=ds=>{const d=parse(ds,"12:00");return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"};
const isLate=t=>!t.done&&t.date&&parse(t.date,t.time||"23:59")<new Date();
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const el=(tag,attrs,...kids)=>{const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
  if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="html")e.innerHTML=v;else e.setAttribute(k,v===true?"":v)}
  for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}return e};
const BELL='<svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg>';

/* ---------- store: on-device (localStorage) ---------- */
const S={tasks:{},cands:{},settings:{lead:0,lastBackup:0},mode:"local"};
const LS="atodeyaru.v1";
function lsLoad(){try{const j=JSON.parse(localStorage.getItem(LS)||"{}");S.tasks=j.tasks||{};S.cands=j.cands||{};S.settings=Object.assign(S.settings,j.settings||{})}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({tasks:S.tasks,cands:S.cands,settings:S.settings}))}catch(e){toast("保存できませんでした（容量不足の可能性）")}}
function put(col,id,data){S[col][id]=data;lsSave();render()}
function del(col,id){delete S[col][id];lsSave();render()}
const putTask=t=>put("tasks",t.id,t);
const putCand=c=>put("cands",c.id,c);
function initStore(){
  lsLoad();
  if(!Object.keys(S.tasks).length&&!localStorage.getItem(LS+".seeded")){
    const t=mkTask({title:"面談設定",cat:"hr",date:today(),time:"20:00"});S.tasks[t.id]=t;
    try{localStorage.setItem(LS+".seeded","1")}catch(e){}lsSave()}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  render();
}

/* ---------- iPhoneカレンダー通知 (.ics) ---------- */
const icsEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1");
const utc=d=>d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+"T"+pad(d.getUTCHours())+pad(d.getUTCMinutes())+"00Z";
function vevent(t){
  const lead=Number(S.settings.lead)||0;const L=["BEGIN:VEVENT","UID:"+t.id+"@atodeyaru","SEQUENCE:"+Math.floor(Date.now()/1000),"DTSTAMP:"+utc(new Date()),"SUMMARY:"+icsEsc(t.title)];
  if(t.time){const s=parse(t.date,t.time);L.push("DTSTART:"+utc(s),"DTEND:"+utc(new Date(s.getTime()+30*60e3)))}
  else{L.push("DTSTART;VALUE=DATE:"+t.date.replace(/-/g,""),"DTEND;VALUE=DATE:"+addDays(t.date,1).replace(/-/g,""))}
  const desc=[CATNAME[t.cat],t.note].filter(Boolean).join("\n");if(desc)L.push("DESCRIPTION:"+icsEsc(desc));
  L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(t.title),"TRIGGER:"+(t.time?(lead?"-PT"+lead+"M":"PT0M"):"PT9H"),"END:VALARM","END:VEVENT");
  return L.join("\r\n")}
function saveFile(name,text,type){
  const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60e3)}
function addToCal(ts){
  ts=ts.filter(t=>t.date&&!t.done);if(!ts.length){toast("日付のあるタスクがありません");return}
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//atodeyaru//JA","CALSCALE:GREGORIAN","METHOD:PUBLISH",...ts.map(vevent),"END:VCALENDAR"].join("\r\n");
  saveFile(ts.length===1?"task.ics":"tasks.ics",ics,"text/calendar;charset=utf-8");

    el("div",{class:"sact"},el("button",{type:"button",class:"btn",onclick:close},"閉じる"),
      todo.length?el("button",{type:"button",class:"btn pri",onclick:()=>{addToCal(todo);close()}},"まとめて登録"):null),
    el("div",{class:"help",style:"margin-top:12px"},"日時を変えたタスクは「通知を登録」がもう一度表示されます。登録し直すと、カレンダーの予定も新しい日時に置き換わります。")));
});
document.getElementById("setBtn").addEventListener("click",()=>{
  const fi=el("input",{type:"file",id:"imp",accept:".json,application/json",hidden:true,onchange:async()=>{
    const f=fi.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.tasks)throw 0;
      S.tasks=j.tasks;S.cands=j.cands||{};lsSave();render();close();toast("復元しました（タスク"+Object.keys(S.tasks).length+"件）")}catch(e){toast("読み込めませんでした。バックアップのファイルを選んでください")}}});
  sheet("設定",el("div",null,
    el("span",{class:"lbl"},"通知のタイミング（時刻ありのタスク）"),
    el("div",{class:"seg",style:"margin:6px 0 16px"},[[0,"ちょうど"],[10,"10分前"],[30,"30分前"],[60,"1時間前"]].map(([v,n])=>el("button",{type:"button",class:Number(S.settings.lead)===v?"on":"",onclick:e=>{S.settings.lead=v;lsSave();[...e.target.parentNode.children].forEach(b=>b.classList.toggle("on",b===e.target));toast("次の登録から「"+n+"」で通知します")}},n))),
    el("span",{class:"lbl"},"バックアップ"),
    el("div",{class:"help",style:"margin:4px 0 8px"},"データはこのiPhoneの中だけにあります。機種変更やアプリの削除に備えて、ときどき保存してください。「ファイル」アプリやiCloud Driveに保存できます。"),
    el("div",{class:"setrow"},
      el("button",{type:"button",class:"btn sm pri",onclick:()=>{S.settings.lastBackup=Date.now();lsSave();
        saveFile("atodeyaru-backup-"+today()+".json",JSON.stringify({app:"atodeyaru",at:new Date().toISOString(),tasks:S.tasks,cands:S.cands},null,1),"application/json");render()}},"バックアップを保存"),
      el("button",{type:"button",class:"btn sm",onclick:()=>fi.click()},"バックアップから復元"),fi),
    el("div",{class:"sact"},el("button",{type:"button",class:"btn",onclick:close},"閉じる"))));
});
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}

/* ---------- toast & in-page alerts ---------- */
let tt=null;
function toast(msg,undo){const old=document.querySelector(".toast");if(old)old.remove();clearTimeout(tt);
  const t=el("div",{class:"toast",role:"status"},msg,undo?el("button",{type:"button",style:"margin-left:12px;background:none;border:0;color:inherit;text-decoration:underline;font-weight:700",onclick:()=>{undo();t.remove()}},"元に戻す"):null);
  document.body.append(t);tt=setTimeout(()=>t.remove(),undo?4500:2600)}
const fired=new Set();
setInterval(()=>{const now=new Date();allTasks().forEach(t=>{if(t.done||!t.date||!t.time||fired.has(t.id+t.date+t.time))return;const d=parse(t.date,t.time);
  if(d<=now&&now-d<120e3){fired.add(t.id+t.date+t.time);toast("⏰ "+t.time+" "+t.title);try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}render()}})},30e3);
setInterval(render,5*60e3);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});

initStore();
})();
</script>
